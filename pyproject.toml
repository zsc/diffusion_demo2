[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-demo"
version = "2.0.0"
description = "Diffusion (DiT) Training and Sampling Demo"
readme = "CLAUDE.md"
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "requests>=2.25.0",
    "tqdm>=4.60.0",
    "tensorboard>=2.10.0",
    "einops>=0.6.0",
]

[project.scripts]
diffusion-demo = "diffusion_demo.server:main"

[tool.setuptools.packages.find]
where = ["src"]
